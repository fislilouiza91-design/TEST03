<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 16px;
      overscroll-behavior: none;
      transition: background 0.3s, color 0.3s;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #ff4747;
      letter-spacing: -0.5px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      text-align: center;
    }
    .content {
      font-size: 12px;
      line-height: 1.6;
      color: #475569;
    }
    .content ul {
      padding-inline-start: 16px;
      margin-bottom: 12px;
    }
    .content li {
      margin-bottom: 6px;
    }
    .highlight-box {
      background: #fff;
      border: 1px solid #ff6b35;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      box-shadow: 0 2px 8px rgba(255,107,53,0.1);
      position: relative;
      overflow: hidden;
    }
    .highlight-box::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      inset-inline-start: 0;
      width: 4px;
      background: linear-gradient(to bottom, #ff6b35, #ff4747);
    }
    .highlight-box p {
      font-size: 11.5px;
      color: #334155;
      margin: 0;
    }
    .highlight-box strong {
      color: #ff4747;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      background: linear-gradient(135deg, #ff6b35, #ff4747);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 16px;
    }
    .privacy-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
    }
    .privacy-link:hover {
      text-decoration: underline;
    }
    
    @media (prefers-color-scheme: dark) {
      body { background: #16161c; color: #e2e8f0; }
      .header { border-color: #2a2a33; }
      .title { color: #f1f5f9; }
      .content { color: #94a3b8; }
      .highlight-box { background: #1e1e24; border-color: #ff4747; }
      .highlight-box p { color: #cbd5e1; }
      .footer { color: #64748b; }
      .privacy-link { color: #60a5fa; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Nezzer</div>
  </div>
  
  <div class="title" id="pop-title"></div>

  <div class="content">
    <span id="pop-intro"></span>
    <ul>
      <li id="pop-li-1"></li>
      <li id="pop-li-2"></li>
      <li id="pop-li-3"></li>
      <li id="pop-li-4"></li>
      <li id="pop-li-5"></li>
    </ul>

    <div class="highlight-box">
      <p id="pop-affiliate"></p>
    </div>
  </div>

  <a href="https://www.aliexpress.com/s/aff-third-party-landing/aliexpress" target="_blank" class="btn" id="pop-btn"></a>

  <div class="footer">
    <a href="https://fslbot.github.io/nezzer-privacy/" target="_blank" class="privacy-link" id="pop-privacy"></a>
    <br><br>
    <span id="pop-footer"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
