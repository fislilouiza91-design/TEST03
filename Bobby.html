<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f8fafc; padding: 15px; height: 100vh; overflow-y: auto; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: all 0.2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-color: #cbd5e1; }
    .img-box { width: 100%; aspect-ratio: 1/1; border-radius: 4px; overflow: hidden; margin-bottom: 5px; background: #fff; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .title { font-size: 11px; font-weight: bold; height: 28px; overflow: hidden; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .price { font-size: 13px; color: #ef4444; font-weight: bold; }
    .empty { text-align: center; color: #64748b; margin-top: 50px; font-size: 14px; line-height: 1.5; }
    
    @media (prefers-color-scheme: dark) {
      body { background: #16161c; }
      .card { background: #1e1e24; border-color: #2a2a33; }
      .card:hover { border-color: #3a3a44; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
      .img-box { background: #25252c; }
      .title { color: #e2e8f0; }
      .price { color: #f87171; }
      .empty { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script src="panel-history.js"></script>
</body>
</html>
