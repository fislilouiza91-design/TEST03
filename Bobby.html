<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      width: 100%; height: 100vh; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
      background: #ffffff !important; /* خلفية بيضاء صلبة */
      display: flex; flex-direction: column; overflow: hidden; 
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    #results { flex: 1; overflow-y: auto; padding: 12px 10px; width: 100%; background: #ffffff; }
    
    /* شبكة 3 أعمدة */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 16px 8px; 
      width: 100%; 
      align-content: start; 
    }
    
    /* الكارت: خلفية بيضاء صلبة ومستقيمة */
    .product-card { 
      display: flex; flex-direction: column; 
      text-decoration: none; color: inherit;
      position: relative;
      background: #ffffff !important;
      width: 100%;
    }
    
    /* حاوية الصورة */
    .img-box { 
      width: 100%; 
      aspect-ratio: 1 / 1; 
      background: #f8fafc; 
      position: relative;
      overflow: hidden; 
      border-radius: 8px;
    }
    .img-box img { 
      width: 100%; height: 100%; object-fit: cover; 
    }
    
    /* زر + ثابت وواضح */
    .add-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      background: #ffffff !important;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2);
      color: #333;
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      z-index: 10;
    }
    
    /* تفاصيل المنتج: ارتفاعات ثابتة لمنع التبعثرة */
    .info { 
      padding: 8px 0 0 0; 
      display: flex; 
      flex-direction: column; 
      width: 100%;
    }
    
    /* العنوان: سطرين بالضبط */
    .title { 
      font-size: 12px; 
      color: #1a1a1a; 
      line-height: 1.25; 
      height: 30px; /* ارتفاع ثابت */
      overflow: hidden; 
      display: -webkit-box; 
      -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical; 
      margin-bottom: 6px; 
      unicode-bidi: plaintext; 
      text-align: start; 
    }
    
    /* الشحن */
    .shipping-row {
      display: flex; 
      align-items: center; 
      gap: 4px;
      font-size: 11px; 
      color: #008f00; 
      font-weight: 600;
      height: 16px; /* ارتفاع ثابت */
      margin-bottom: 2px;
      direction: ltr; 
      justify-content: flex-start;
    }
    
    /* المبيعات والتقييم */
    .meta-row {
      display: flex; 
      align-items: center; 
      gap: 4px;
      font-size: 11px; 
      color: #888888;
      height: 16px; /* ارتفاع ثابت */
      margin-bottom: 4px;
      direction: ltr; 
      justify-content: flex-start;
    }
    .divider { color: #d1d5db; margin: 0 2px; font-size: 10px; }
    .rating { display: flex; align-items: center; gap: 2px; color: #555555; font-weight: 600; }
    .star { color: #ffa41c; font-size: 12px; }
    
    /* السعر */
    .price { 
      font-size: 16px; 
      font-weight: 800; 
      color: #000000 !important; 
      white-space: nowrap; 
      direction: ltr; 
      text-align: start;
      height: 22px; /* ارتفاع ثابت */
    }

    /* هياكل التحميل */
    .skeleton { background: #f1f5f9; border-radius: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .skeleton-card { display: flex; flex-direction: column; gap: 6px; background: #fff; }
    .skeleton-img { width: 100%; aspect-ratio: 1/1; border-radius: 8px; }
    .skeleton-text { width: 100%; height: 12px; margin-top: 4px; }
    .skeleton-text.short { width: 60%; }

    #loader-more { display: none; text-align: center; padding: 15px; color: #ff4747; font-weight: bold; font-size: 12px; background: #fff; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,71,71,0.3); border-top-color: #ff4747; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-left: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="results">
    <div class="grid" id="main-grid">
      <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
    </div>
    <div id="loader-more"><span class="spinner"></span> جاري جلب المزيد...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
