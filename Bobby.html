<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>AliFinder Clean</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <span>AliFinder</span>
    </div>
    <button id="themeToggle" class="icon-btn" title="الوضع الليلي">🌙</button>
  </header>

  <div class="sort-bar">
    <button class="sort-btn" data-sort="cheapest">
      <span class="emoji">💰</span>
      <span>الأرخص</span>
    </button>
    <button class="sort-btn active" data-sort="popular">
      <span class="emoji">🔥</span>
      <span>الأكثر طلباً</span>
    </button>
    <button class="sort-btn" data-sort="rating">
      <span class="emoji">⭐</span>
      <span>الأكثر تقييماً</span>
    </button>
  </div>

  <main id="results" class="results">
    <div class="state-msg">
      <div class="spinner"></div>
      <p>جاري البحث عن منتجات مشابهة...</p>
    </div>
  </main>

  <footer class="footer">
    <button id="loadMore" class="load-more" disabled>
      تحميل المزيد
    </button>
    <p id="status" class="status"></p>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
