<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100%; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc !important; display: flex; flex-direction: column; overflow: hidden;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    #results { flex: 1; overflow-y: auto; padding: 10px 12px; width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
    .product-card { display: flex; flex-direction: column; text-decoration: none; color: inherit; background: #ffffff !important; border: 1px solid #e2e8f0; border-radius: 10px; padding: 6px; width: 100%; height: 100%; transition: all 0.25s ease; }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); border-color: #cbd5e1; }
    .img-box { width: 100%; aspect-ratio: 1 / 1; background: #ffffff; border-radius: 6px; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .info { display: flex; flex-direction: column; width: 100%; flex: 1; padding: 0 2px; }
    .title { font-size: 11px; color: #1e293b; font-weight: 500; line-height: 1.25; height: 28px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px; }
    .price { font-size: 14px; font-weight: 800; color: #ef4444 !important; white-space: nowrap; height: 18px; letter-spacing: -0.5px; overflow: hidden; text-overflow: ellipsis; }
    .empty { text-align: center; color: #64748b; padding: 20px; grid-column: 1/-1; font-size: 14px; }

    @media (prefers-color-scheme: dark) {
      body { background: #16161c !important; }
      ::-webkit-scrollbar-thumb { background: #3a3a44; }
      .product-card { background: #1e1e24 !important; border-color: #2a2a33; }
      .product-card:hover { border-color: #3a3a44; box-shadow: 0 6px 12px rgba(0,0,0,0.5); }
      .img-box { background: #25252c; }
      .title { color: #e2e8f0; }
      .price { color: #f87171 !important; }
      .empty { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <div id="results">
    <div class="grid" id="grid"></div>
  </div>
  <script src="panel-history.js"></script>
</body>
</html>
