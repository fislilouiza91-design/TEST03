<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact - Carrefour Electronique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #e30613; --dark-color: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        .header-section { background: var(--primary-color); color: white; padding: 60px 0; text-align: center; }
        .contact-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .btn-custom { background: var(--primary-color); color: white; border: none; }
        .btn-custom:hover { background: #b3050e; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container"><a class="navbar-brand" href="index.html"><i class="fas fa-arrow-left text-danger"></i> Retour à l'accueil</a></div>
    </nav>
    <div class="header-section">
        <h1 class="display-4 fw-bold">Contactez-nous</h1>
        <p>Nous sommes à votre disposition</p>
    </div>
    <div class="container my-5">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="contact-card h-100">
                    <h3>Nos Coordonnées</h3>
                    <hr>
                    <p><i class="fas fa-map-marker-alt text-danger me-2"></i> Adresse : Votre adresse ici</p>
                    <p><i class="fas fa-phone text-danger me-2"></i> Téléphone : 044 95 17 44</p>
                    <p><i class="fas fa-envelope text-danger me-2"></i> Email : contact@carrefourelectronique.com</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="contact-card">
                    <h3>Envoyez-nous un message</h3>
                    <form>
                        <div class="mb-3"><label>Nom complet</label><input type="text" class="form-control" required></div>
                        <div class="mb-3"><label>Email</label><input type="email" class="form-control" required></div>
                        <div class="mb-3"><label>Message</label><textarea class="form-control" rows="4" required></textarea></div>
                        <button type="submit" class="btn btn-custom w-100">Envoyer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
