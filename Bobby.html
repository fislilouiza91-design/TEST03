<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f8fafc; padding: 15px; height: 100vh; overflow-y: auto; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
    .img-box { width: 100%; aspect-ratio: 1/1; border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .title { font-size: 11px; font-weight: bold; height: 28px; overflow: hidden; margin-bottom: 5px; }
    .price { font-size: 13px; color: #ef4444; font-weight: bold; }
    .empty { text-align: center; color: #64748b; margin-top: 50px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script src="panel-history.js"></script>
</body>
</html>
