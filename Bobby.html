<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>AliFinder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100%;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .header {
      background: #ff6b35; color: white; padding: 10px;
      text-align: center; font-weight: bold; font-size: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-shrink: 0;
      position: relative;
    }
    /* زر الإغلاق */
    .close-btn {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 24px; height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover { background: rgba(255,255,255,0.4); }

    .sort-bar {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
      padding: 10px; background: white; border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .sort-btn {
      padding: 6px 2px; background: #f1f5f9; border: 1px solid transparent;
      border-radius: 6px; cursor: pointer; font-weight: bold; color: #475569;
      font-size: 12px; transition: 0.2s;
    }
    .sort-btn.active { background: #ff6b35; color: white; border-color: #ff6b35; }

    #results { flex: 1; overflow-y: auto; padding: 8px; width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }

    .product-card {
      display: flex; flex-direction: column; background: white;
      border-radius: 6px; overflow: hidden; text-decoration: none;
      border: 1px solid #e2e8f0; transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .img-box { width: 100%; height: 100px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .info { padding: 6px; display: flex; flex-direction: column; flex: 1; }
    .title { font-size: 10px; color: #334155; line-height: 1.3; height: 26px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px; }
    .price { font-size: 12px; font-weight: bold; color: #ef4444; margin-top: auto; }

    .footer { padding: 8px; background: white; border-top: 1px solid #e2e8f0; flex-shrink: 0; text-align: center; }
    .load-more { width: 100%; padding: 8px; background: #ff6b35; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    .load-more:hover { background: #e65c2b; }
    .load-more:disabled { background: #cbd5e1; cursor: not-allowed; }
    .loader { text-align: center; padding: 20px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <button class="close-btn" id="closeBtn">&times;</button>
    AliFinder
  </div>
  
  <div class="sort-bar">
    <button class="sort-btn" data-sort="cheapest">الأرخص</button>
    <button class="sort-btn active" data-sort="popular">الأكثر طلباً</button>
    <button class="sort-btn" data-sort="rating">الأكثر تقيماً</button>
  </div>

  <div id="results">
    <div class="loader">جاري البحث...</div>
  </div>

  <div class="footer">
    <button id="loadMoreBtn" class="load-more" disabled>تحميل المزيد</button>
  </div>

  <script src="popup.js"></script>
  <script>
    // كود إغلاق النافذة العائمة
    document.getElementById('closeBtn').addEventListener('click', () => {
      window.parent.postMessage('CLOSE_ALIFINDER', '*');
    });
  </script>
</body>
</html>
