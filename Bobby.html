<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100%; height: 100vh; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; display: flex; flex-direction: column; overflow: hidden; }
    
    .sort-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 10px; background: white; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
    .sort-btn { padding: 8px 2px; background: #f1f5f9; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-weight: bold; color: #475569; font-size: 12px; transition: 0.2s; }
    .sort-btn.active { background: #ff6b35; color: white; border-color: #ff6b35; }
    
    #results { flex: 1; overflow-y: auto; padding: 8px; width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
    
    .product-card { display: flex; flex-direction: column; background: white; border-radius: 6px; overflow: hidden; text-decoration: none; border: 1px solid #e2e8f0; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    .img-box { width: 100%; height: 120px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .info { padding: 8px; display: flex; flex-direction: column; flex: 1; }
    
    .title { 
      font-size: 11px; color: #1e293b; font-weight: 500; line-height: 1.4; 
      height: 30px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
      margin-bottom: 8px; unicode-bidi: plaintext; text-align: start; 
    }
    
    /* السطر السفلي: نستخدم space-between ليتوزع تلقائياً */
    .bottom-row { 
      display: flex; justify-content: space-between; align-items: center; 
      margin-top: auto; width: 100%; gap: 4px; 
      flex-wrap: nowrap; /* منع النزول لسطر جديد */
    }
    
    /* النجوم ثابتة دائماً من اليسار لليمين */
    .stars-box { display: flex; align-items: center; gap: 2px; direction: ltr; flex-shrink: 0; }
    .stars { font-size: 11px; letter-spacing: 0.5px; }
    .star-filled { color: #ffa41c; }
    .star-empty { color: #d1d5db; }
    .rating-num { font-size: 10px; color: #64748b; font-weight: bold; }
    
    /* السعر: نمنعه من الالتفاف ونصغر حجمه قليلاً ليناسب المساحة */
    .price { 
      font-size: 13px; font-weight: 800; color: #ef4444; 
      white-space: nowrap; /* منع السعر من النزول لسطر جديد */
      text-align: end;
    }

    .loader { text-align: center; padding: 20px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="sort-bar">
    <button class="sort-btn" data-sort="cheapest">الأرخص</button>
    <button class="sort-btn active" data-sort="popular">الأكثر طلباً</button>
    <button class="sort-btn" data-sort="rating">الأكثر تقيماً</button>
  </div>
  
  <div id="results"><div class="loader">جاري البحث...</div></div>
  <script src="popup.js"></script>
</body>
</html>
