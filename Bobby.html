<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --primary: #ff4747;
      --bg: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      width: 100%; height: 100vh; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background: var(--bg); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }
    
    /* شريط التمرير المخصص */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* حاوية المنتجات تأخذ كامل الشاشة */
    #results { flex: 1; overflow-y: auto; padding: 12px; width: 100%; position: relative; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; align-content: start; }
    
    /* كارت المنتج */
    .product-card { 
      display: flex; flex-direction: column; background: white; 
      border-radius: 12px; overflow: hidden; text-decoration: none; 
      border: 1px solid var(--border); transition: all 0.3s ease; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: relative;
    }
    .product-card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 12px 24px rgba(0,0,0,0.1); 
    }
    
    .img-box { 
      width: 100%; height: 150px; background: #f8fafc; 
      display: flex; align-items: center; justify-content: center; overflow: hidden; 
    }
    .img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .product-card:hover .img-box img { transform: scale(1.08); }
    
    .info { padding: 10px; display: flex; flex-direction: column; flex: 1; }
    .title { 
      font-size: 12px; color: var(--text-main); font-weight: 600; line-height: 1.4; 
      height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical; margin-bottom: 10px; 
      unicode-bidi: plaintext; text-align: start; 
    }
    
    .bottom-row { 
      display: flex; justify-content: space-between; align-items: center; 
      margin-top: auto; width: 100%; gap: 4px;
    }
    
    .stars-box { display: flex; align-items: center; gap: 2px; direction: ltr; flex-shrink: 0; }
    .stars { font-size: 11px; }
    .star-filled { color: #ffa41c; }
    .star-empty { color: #e2e8f0; }
    .rating-num { font-size: 10px; color: var(--text-muted); font-weight: 700; }
    
    .price { font-weight: 800; color: var(--primary); white-space: nowrap; text-align: end; direction: ltr; }
    .price-normal { font-size: 14px; }
    .price-sm { font-size: 12px; }
    .price-xs { font-size: 10px; }

    /* هياكل التحميل */
    .skeleton { background: #e2e8f0; border-radius: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .skeleton-card { height: 260px; background: white; border-radius: 12px; border: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .skeleton-img { width: 100%; height: 150px; border-radius: 8px; }
    .skeleton-text { width: 100%; height: 14px; }
    .skeleton-text.short { width: 60%; }

    /* مؤشر التحميل السفلي */
    #loader-more {
      display: none; text-align: center; padding: 20px; 
      color: var(--primary); font-weight: bold; font-size: 13px;
    }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255, 71, 71, 0.3); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-left: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="results">
    <div class="grid" id="main-grid">
      <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
    </div>
    
    <div id="loader-more">
      <span class="spinner"></span> جاري جلب المزيد...
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
